<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Capture - Local</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo-area">
      <div class="logo-icon">LC</div>
      <h1>Lead Capture</h1>
    </div>
    <div class="header-links">
      <button id="btnSettings" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="errorBanner" class="error-banner hidden"></div>

  <div class="page-info">
    <div id="pageTitle" class="page-title">Detecting page...</div>
    <div id="pageUrl" class="page-url">Checking active tab</div>
    <div id="pageStatus" class="status-badge status-ready">Ready to scan</div>
  </div>

  <button id="btnScan" class="btn btn-primary">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span>Scan Current Page</span>
  </button>

  <div id="resultsCard" class="results-card hidden">
    <div class="results-title">Scan Complete</div>
    <div class="metrics-grid">
      <div class="metric-box">
        <div id="valTotal" class="metric-value">0</div>
        <div class="metric-label">Total Leads Found</div>
      </div>
      <div class="metric-box">
        <div id="valEmails" class="metric-value">0</div>
        <div class="metric-label">Valid Emails</div>
      </div>
      <div class="metric-box">
        <div id="valPhones" class="metric-value">0</div>
        <div class="metric-label">Valid Phones</div>
      </div>
      <div class="metric-box">
        <div id="valDupes" class="metric-value">0</div>
        <div class="metric-label">Duplicates Ignored</div>
      </div>
    </div>
    <button id="btnOpenReview" class="btn btn-primary">
      <span>Open Lead Review</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <button id="btnViewSaved" class="btn btn-secondary">
    <span>View All Saved Leads</span>
  </button>

  <div class="footer">
    <span>Local-First &bull; No Telemetry</span>
    <a id="linkClearData">Clear Data</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
